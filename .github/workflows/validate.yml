name: Validate lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install lab dependencies
        run: python -m pip install -r src/webapp/requirements.txt -r src/function/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit
          done
